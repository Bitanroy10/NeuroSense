<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dbe7f5">
  <title>NeuroSense</title>
  <style>.hidden{display:none!important}body{margin:0;font-family:system-ui,sans-serif}</style>
  <script>
    // Shows a clear message if CSS/JS files are missing from the deployment
    function loadFail(u){var f=function(){document.body.insertAdjacentHTML('afterbegin','<div style="position:fixed;z-index:999;top:0;left:0;right:0;padding:14px;background:#fde8e8;color:#9b1c1c;font:15px system-ui">Could not load <b>'+u+'</b>. Make sure the <code>public/css</code> and <code>public/js</code> folders are in your GitHub repo, then redeploy.</div>')};document.body?f():addEventListener('DOMContentLoaded',f)}
  </script>
  <link rel="stylesheet" href="css/styles.css" onerror="loadFail(this.href)">
</head>
<body>
  <div class="blobs"><i></i><i></i><i></i></div>
  <div id="phone">
    <section id="auth" class="screen"></section>
    <section id="app" class="screen hidden">
      <main id="view"></main>
      <nav id="tabs">
        <i id="ind"></i>
        <button data-tab="dashboard">▦<span>Dashboard</span></button>
        <button data-tab="insights">⌁<span>Insights</span></button>
        <button data-tab="profile">☺<span>Profile</span></button>
      </nav>
    </section>
  </div>
  <dialog id="dlg"></dialog>
  <div id="breathe" class="hidden"></div>
  <div id="toasts"></div>
  <script type="module" src="js/app.js" onerror="loadFail(this.src)"></script>
</body>
</html>
